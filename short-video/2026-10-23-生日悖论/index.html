<!doctype html>
<html lang="zh" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans SC"; font-weight: 900; src: url("assets/fonts/noto-sc-900.ttf"); }
      @font-face { font-family: "Noto Sans SC"; font-weight: 500; src: url("assets/fonts/noto-sc-500.ttf"); }
      :root {
        --ground: #f4d500;
        --ink: #141414;
        --accent: #c8221a;
        --font-display: "Noto Sans SC", "Archivo Black", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="pairs" data-composition-id="pairs" data-composition-src="compositions/pairs.html"
        data-start="5.4" data-duration="7.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html"
        data-start="13.2" data-duration="6.7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="19.9" data-duration="8.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <audio id="vo-hook" class="clip" data-start="0.2" data-duration="4.96" data-track-index="2" data-volume="1" src="assets/voice/vo-hook.wav"></audio>
      <audio id="vo-pairs" class="clip" data-start="5.6" data-duration="7.28" data-track-index="2" data-volume="1" src="assets/voice/vo-pairs.wav"></audio>
      <audio id="vo-result" class="clip" data-start="13.4" data-duration="6.24" data-track-index="2" data-volume="1" src="assets/voice/vo-result.wav"></audio>
      <audio id="vo-outro" class="clip" data-start="20.1" data-duration="6.72" data-track-index="2" data-volume="1" src="assets/voice/vo-outro.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
