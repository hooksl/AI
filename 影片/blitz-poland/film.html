<script>
// cinecode QUICK MODE starter. One file holds the whole film: timeline, scenes, on-screen text and the sound.
//
// Contract used by tools/capture.mjs:
//   window.READY            Promise<{frames, fps, width, height, renderer, title, bounds, vo}>, resolves after fonts are
//                           loaded (bounds = scene starts + the end, for tools/make.py and the per-scene checks)
//   window.renderFrame(i)   draws frame i; a pure function of (i / FPS, SEED); nothing carried between frames
//   window.captureFrame(i)  renderFrame(i) + returns a PNG/JPEG data URL of the canvas
//   window.renderAudio()    Promise<AudioBuffer>: the whole soundtrack, rendered OFFLINE (OfflineAudioContext)
// URL params: w, h (default 1080x1920 = 9:16), seed, capture=1 (set by capture.mjs: no preview loop),
//             shutter=<samples> (0 = motion blur off, for drafts), weave=<px>, tone=0 (finishing overrides)
//
// Renders: python3 tools/make.py stills | draft | final (KIT/references/quick-mode.md §3-4). It captures, lays the
// narration on the score (audio/mix.json), masters to -14 LUFS and runs the checks; never chain capture.mjs,
// master_audio.py and qc.py by hand.
//
// Edit only the FILM section below: TITLE, PURPOSE, FINISH, DURATION, PALETTE, TYPE (roles, check), CUES, VO, SCENES, SFX, ROOM,
// ARRANGEMENT, the scene functions and score(). Helpers stay as they are: EASE, MOTION (at, back, anticipate, spring, stagger, arc), CAM (pan, tilt, dolly, zoom, truck, crane, orbit, dollyZoom,
// pushTo, fpv, handheld, matchFrom, rackFocus), retime() (speed ramp, slow motion, time-lapse, freeze), plane(),
// TRANSITION (dissolve, wipe, whip, iris), lazy() (seeded data built once), label() (on-screen names), and the sound voices.
// Seeded data (star fields, layouts) is built with lazy() and first used inside a draw call: SEED is set further down
// the file, so a top-level rng() call here would run before it.

// ============================== FILM ==============================
const TITLE = '闪电波兰';

// Look: the film draws its own copperplate engraving (styles/engraving.md); the family below only sets the frame pass.

const LOOK = LOOKS[LOOK_ID];

const BEAT0 = 0;
const beat = (n) => BEAT0 + n * 60 / BPM, bar = (n) => beat(4 * n);
// Chopin, Scherzo No. 3 Op. 39 (La Pianista, public domain): 20.38-60.6 s of the recording on 0-40, a scripted

const ROOM = { secs: 2.2, decay: 3.2, tone: 5000 };
const ARRANGEMENT = [{ section: 'recording', from: 0, to: CUES.end, parts: [] }];

// ============================== ENGRAVING (this film's own engine) ==============================
// Every tone is lines: up to three hatch families (the second crossing at +57°, the third at -38°) switch on by darkness,
// each line swelling and tapering (styles/engraving.md §2). Shapes are { p: Path2D, b: [x0, y0, x1, y1] } in design units
// (1920 x 1080, origin at the centre); lines live in the shape's own space, so they travel with it and never swim.
const DW = 1920, DH = 1080, INK = PALETTE.ink, PAPER = PALETTE.bg, D2R = Math.PI / 180;
const SH = {
  rect: (x, y, w, h) => { const p = new Path2D(); p.rect(x, y, w, h); return { p, b: [x, y, x + w, y + h] }; },
  poly: (pts) => { const p = new Path2D(); let b = [Infinity, Infinity, -Infinity, -Infinity];
    pts.forEach(([x, y], i) => { i ? p.lineTo(x, y) : p.moveTo(x, y); b = [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)]; });
    p.closePath(); return { p, b }; },
  circle: (x, y, r) => { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return { p, b: [x - r, y - r, x + r, y + r] }; },
  ellipse: (x, y, rx, ry) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, 0, 0, TAU); return { p, b: [x - rx, y - ry, x + rx, y + ry] }; },
  round: (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return { p, b: [x, y, x + w, y + h] }; },
  join: (...ss) => { const p = new Path2D(); let b = [Infinity, Infinity, -Infinity, -Infinity];
    for (const s of ss) { p.addPath(s.p); b = [Math.min(b[0], s.b[0]), Math.min(b[1], s.b[1]), Math.max(b[2], s.b[2]), Math.max(b[3], s.b[3])]; }
    return { p, b }; },
};
// darkness fields 0..1 (0 = bare paper); light always from the upper left
const TN = {
  lit: (cx, cy, r, base, amt = 0.3, nz = 0.06) => (x, y) => base + amt * ((x - cx) * 0.6 + (y - cy) * 0.8) / r + nz * (noise1(x * 0.021 + y * 0.013 + 3) - 0.5),
  flat: (v) => () => v,
  vgrad: (y0, y1, a, b, nz = 0.04) => (x, y) => lerp(a, b, clamp((y - y0) / (y1 - y0))) + nz * (noise1(x * 0.01 + y * 0.03) - 0.5),
  pool: (cx, cy, r, inner, outer, pw = 1.4) => (x, y) => lerp(inner, outer, Math.pow(clamp(Math.hypot(x - cx, (y - cy) * 1.25) / r), pw)),
};

const paperTex = lazy(() => {                 // laid paper, made once, laid in world space so the camera moves over it
  const c = document.createElement('canvas'); c.width = 2600; c.height = 1600;
  const p = c.getContext('2d'), r = rng(91);
  p.fillStyle = PAPER; p.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 46; i++) {               // the sheet's uneven body
    const x = r() * c.width, y = r() * c.height, rr = 140 + r() * 360, gr = p.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, r() < 0.55 ? 'rgba(255,250,236,0.12)' : 'rgba(160,128,80,0.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    p.fillStyle = gr; p.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  p.strokeStyle = '#8a7650'; p.lineWidth = 1;
  for (let y = 0; y < c.height; y += 8.5) { p.globalAlpha = 0.035 + 0.02 * r(); p.beginPath(); p.moveTo(0, y); p.lineTo(c.width, y + r() - 0.5); p.stroke(); }
  for (let x = 30; x < c.width; x += 150) { p.globalAlpha = 0.045; p.beginPath(); p.moveTo(x, 0); p.lineTo(x + 4, c.height); p.stroke(); }
  for (let i = 0; i < 3200; i++) {
    const x = r() * c.width, y = r() * c.height, a = r() * TAU, l = 3 + r() * 11;
    p.globalAlpha = 0.05 + r() * 0.09; p.strokeStyle = r() < 0.55 ? '#a08c62' : '#fffaea'; p.lineWidth = 0.6;
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l / 2 + (r() - 0.5) * 3, y + Math.sin(a) * l / 2 + (r() - 0.5) * 3, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  p.globalAlpha = 1;
  for (let i = 0; i < 30; i++) {               // foxing
    const x = r() * c.width, y = r() * c.height, rr = 2 + r() * 12, gr = p.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, 'rgba(150,100,45,0.18)'); gr.addColorStop(1, 'rgba(150,100,45,0)'); p.fillStyle = gr; p.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  return c;
});

// the camera: cam = { x, y, z } in design units; f < 1 = a far layer (parallax), zf = its own extra zoom (dolly zoom)
function camView(g, S, cam = {}, f = 1, zf = 1) {
  const z = (1 + ((cam.z ?? 1) - 1) * f) * zf, sc = S.W / DW * z;
  g.setTransform(sc, 0, 0, sc, S.W / 2 - (cam.x ?? 0) * f * sc, S.H / 2 - (cam.y ?? 0) * f * sc);
}
function stage(g, S, cam = {}) { camView(g, S, cam); g.drawImage(paperTex(), -1300, -800); }

function emitRun(g, r, nx, ny) {
  const n = r.length / 3; if (n < 2) return;
  const hw = (i) => { const u = i / (n - 1), tp = Math.max(0, Math.min(1, u / 0.22, (1 - u) / 0.22)); return r[i * 3 + 2] * 0.5 * (0.16 + 0.84 * Math.pow(tp, 0.7)); };
  g.moveTo(r[0] + nx * hw(0), r[1] + ny * hw(0));
  for (let i = 1; i < n; i++) g.lineTo(r[i * 3] + nx * hw(i), r[i * 3 + 1] + ny * hw(i));
  for (let i = n - 1; i >= 0; i--) g.lineTo(r[i * 3] - nx * hw(i), r[i * 3 + 1] - ny * hw(i));
  g.closePath();
}
function hatchLines(g, box, angDeg, sp, wmax, th, tone, phase = 0) {
  const a = angDeg * D2R, dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
  const [x0, y0, x1, y1] = box; let n0 = Infinity, n1 = -Infinity, d0 = Infinity, d1 = -Infinity;
  for (const [x, y] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) {
    const n = x * nx + y * ny, d = x * dx + y * dy; n0 = Math.min(n0, n); n1 = Math.max(n1, n); d0 = Math.min(d0, d); d1 = Math.max(d1, d);
  }
  const step = Math.max(2.5, sp * 0.75);
  for (let o = Math.ceil((n0 - phase) / sp) * sp + phase; o <= n1; o += sp) {
    const li = Math.round(o / sp), jit = 0.82 + 0.36 * hash1(li * 7.31 + angDeg * 0.37);
    let run = null;
    for (let s = d0 - step; s <= d1 + step; s += step) {
      const x = nx * o + dx * s, y = ny * o + dy * s, v = tone(x, y);
      const w = v > th ? wmax * jit * Math.pow(Math.min(1, (v - th) / 0.34), 0.8) : 0;
      if (w > 0.14) (run ??= []).push(x, y, w);
      else if (run) { emitRun(g, run, nx, ny); run = null; }
    }
    if (run) emitRun(g, run, nx, ny);
  }
}
function wash(g, s, color, a = 0.6) {          // transparent watercolour: spills a little, a darker tide line at the wet edge
  g.save(); g.globalCompositeOperation = 'multiply'; g.translate(1.8, 1.2);
  g.globalAlpha = a; g.fillStyle = color; g.fill(s.p);
  g.globalAlpha = a * 0.45; g.lineWidth = 2.4; g.strokeStyle = color; g.stroke(s.p); g.restore();
}
function contour(g, s, w = 2) {               // fine toward the light, heavier on the far side (kept outside the shape)
  g.save(); g.strokeStyle = INK; g.lineJoin = 'round'; g.lineWidth = w * 0.5; g.stroke(s.p);
  const out = new Path2D(); out.rect(-6000, -6000, 12000, 12000); out.addPath(s.p);
  g.clip(out, 'evenodd'); g.translate(w * 0.45, w * 0.55); g.lineWidth = w; g.stroke(s.p); g.restore();
}
const FAMS = [[0, 0.12, 1, 1], [57, 0.47, 0.84, 1.1], [-38, 0.76, 0.68, 1.28]];
// engrave(g, shape, { angle, tone, sp, w, wash, washA, line, knock, fams, phase })
function engrave(g, s, o = {}) {
  const tone = typeof o.tone === 'function' ? o.tone : TN.flat(o.tone ?? 0.4);
  g.save();
  if (o.knock !== false) { g.fillStyle = o.knock || PAPER; g.fill(s.p); }
  if (o.wash) wash(g, s, o.wash, o.washA ?? 0.6);
  g.clip(s.p); g.beginPath();
  const a = o.angle ?? 35, sp = o.sp ?? 6.4, w = o.w ?? 2.7;
  for (const [da, th, wk, sk] of o.fams ?? FAMS) hatchLines(g, s.b, a + da, sp * sk, w * wk, th, tone, o.phase ?? 0);
  g.fillStyle = INK; g.fill(); g.restore();
  if (o.line) contour(g, s, o.line);
}
function burst(g, x, y, k, r0 = 18, r1 = 70, n = 11, w = 2.4) {   // short engraved rays round an impact, k 0..1
  if (k <= 0 || k >= 1) return;
  g.save(); g.fillStyle = INK; g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + hash1(i + 40) * 0.4, a0 = lerp(r0, r1 * 0.6, EASE.out(k)), a1 = lerp(r0 * 1.4, r1, EASE.out(k));
    const run = []; for (let j = 0; j <= 6; j++) { const d = lerp(a0, a1, j / 6); run.push(x + Math.cos(a) * d, y + Math.sin(a) * d, w * (1 - k)); }
    emitRun(g, run, -Math.sin(a), Math.cos(a));
  }
  g.fill(); g.restore();
}

// Lettering belongs to the plate: cut glyph by glyph (a clip opens across each letter like a burin run), never faded.
function cutText(g, S, str, x, y, px, k, o = {}) {
  const role = o.role ?? 'display';
  g.save();
  if (!o.world) g.setTransform(S.W / DW, 0, 0, S.W / DW, 0, 0);
  setType(g, TYPE, role, px, { weight: o.weight ?? (role === 'display' ? 600 : 500), track: o.track ?? (role === 'text' ? 0.16 : 0.08), short: DH });
  g.textBaseline = 'alphabetic'; g.fillStyle = o.color ?? INK;
  const chars = [...str], ws = chars.map((c) => g.measureText(c).width), gap = px * (o.track ?? (role === 'text' ? 0.16 : 0.08));
  const total = ws.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const n = chars.length, spread = o.spread ?? 0.7;
  g.letterSpacing = '0px';
  chars.forEach((c, i) => {
    const p = clamp((k - (i / n) * spread) / (1 - spread));
    if (p > 0) {
      g.save(); g.beginPath(); g.rect(cx - 2, y - px * 1.2, (ws[i] + 4) * EASE.out(p), px * 1.6); g.clip();
      g.fillText(c, cx, y); g.restore();
      if (p < 1 && c.trim()) { g.fillStyle = '#fff8e0'; g.beginPath(); g.arc(cx + ws[i] * EASE.out(p), y - px * 0.35, px * 0.05, 0, TAU); g.fill(); g.fillStyle = o.color ?? INK; }
    }
    cx += ws[i] + gap;
  });
  g.restore();
}
// a plate caption: a small roman line (place and date) over the Chinese line; k = how far the cutting has gone
function caption(g, S, latin, zh, k, o = {}) {
  const x = o.x ?? 96, y = o.y ?? 968, al = o.align ?? 'left';
  if (k > 0) {                                // a deckled paper slip laid down under the words
    g.save(); g.setTransform(S.W / DW, 0, 0, S.W / DW, 0, 0);
    setType(g, TYPE, 'display', 60, { weight: 600, short: DH }); const wz = [...(zh || '')].length * 60 * 1.08;
    setType(g, TYPE, 'text', 34, { weight: 500, short: DH }); g.letterSpacing = '0px'; const wl = g.measureText(latin || '').width + [...(latin || '')].length * 34 * 0.34 + 40;
    const w = Math.max(wz, wl) + 64, h = 170, x0 = al === 'center' ? x - w / 2 : al === 'right' ? x - w + 32 : x - 32, y0 = y - 132;
    const r = rng(31), pts = [], lay = EASE.out(clamp(k * 3));
    for (let i = 0; i <= 20; i++) pts.push([x0 + (w * i) / 20, y0 + (r() - 0.5) * 3]);
    for (let i = 0; i <= 8; i++) pts.push([x0 + w + (r() - 0.5) * 3, y0 + (h * i) / 8]);
    for (let i = 20; i >= 0; i--) pts.push([x0 + (w * i) / 20, y0 + h + (r() - 0.5) * 3]);
    for (let i = 8; i >= 0; i--) pts.push([x0 + (r() - 0.5) * 3, y0 + (h * i) / 8]);
    g.translate(0, (1 - lay) * 14); g.globalAlpha = lay;
    g.fillStyle = 'rgba(28,21,16,0.35)'; g.translate(5, 6); g.fill(SH.poly(pts).p); g.translate(-5, -6);
    g.fillStyle = '#f4ecd8'; g.fill(SH.poly(pts).p); g.strokeStyle = INK; g.lineWidth = 1; g.stroke(SH.poly(pts).p);
    g.restore();
  }
  if (latin) cutText(g, S, latin, x, y - 74, 34, clamp(k * 1.6), { role: 'text', align: al, track: 0.2 });
  if (zh) cutText(g, S, zh, x, y, 60, clamp(k * 1.6 - 0.35), { role: 'display', align: al });
}
function plateFrame(g, S) {                   // the plate mark: a pressed rule and a hairline, fixed to the sheet's edge
  g.save(); g.setTransform(S.W / DW, 0, 0, S.W / DW, 0, 0); g.strokeStyle = INK;
  g.lineWidth = 3.2; g.strokeRect(34, 34, DW - 68, DH - 68);
  g.lineWidth = 1; g.strokeRect(46, 46, DW - 92, DH - 92);
  g.restore();
}

// ---- the gold bar: a frustum seen from above, its four slopes lit by the upper-left light, every face gold-washed
function goldBar(g, x, y, w, h, seed) {
  const i = 13, X = x + w, Y = y + h;
  const faces = [
    [SH.poly([[x + i, y + i], [X - i, y + i], [X - i, Y - i], [x + i, Y - i]]), 0.14, 0],      // top
    [SH.poly([[x, y], [X, y], [X - i, y + i], [x + i, y + i]]), 0.3, 0],                       // north slope, lit
    [SH.poly([[x, y], [x + i, y + i], [x + i, Y - i], [x, Y]]), 0.26, 90],                     // west slope, lit
    [SH.poly([[x, Y], [x + i, Y - i], [X - i, Y - i], [X, Y]]), 0.62, 0],                      // south slope, shade
    [SH.poly([[X, y], [X, Y], [X - i, Y - i], [X - i, y + i]]), 0.66, 90],                     // east slope, shade
  ];
  for (const [s, v, a] of faces) engrave(g, s, { tone: TN.lit(x + w / 2, y + h / 2, w, v, 0.12, 0.05), angle: a, sp: 5.2, w: 2.1, wash: PALETTE.accent, washA: 0.72, line: 1.2 });
  const st = SH.rect(x + w * 0.32, y + h * 0.32, w * 0.36, h * 0.36);                         // the bank's stamp
  engrave(g, st, { tone: 0.5, angle: 45, sp: 3.6, w: 1.3, knock: false, line: 1, fams: [[0, 0.12, 1, 1]] });
  const r = rng(seed); g.save(); g.fillStyle = '#fffbe8'; g.globalAlpha = 0.85;                // burnished glints
  for (let n = 0; n < 3; n++) { g.beginPath(); g.ellipse(x + i + r() * (w - 2 * i), y + i + 4 + r() * 8, 6 + r() * 10, 1.2, 0, 0, TAU); g.fill(); }
  g.restore();
}
function plank(g, x, y, w, h, seed, base = 0.42) {            // a board: grain along it, knots, a dark seam
  const r = rng(seed), kx = x + w * (0.2 + 0.6 * r()), ky = y + h * (0.3 + 0.4 * r());
  const tone = (px, py) => base + 0.16 * (noise1(px * 0.006 + seed) - 0.5) + 0.18 * Math.max(0, 1 - Math.hypot((px - kx) * 0.5, py - ky) / 26) + 0.12 * (py - y) / h;
  const s = SH.rect(x, y, w, h);
  engrave(g, s, { tone, angle: 0, sp: 5.6, w: 2.2, fams: [[0, 0.12, 1, 1], [8, 0.55, 0.7, 1.4]], line: 1.6 });
}

// ---- Scene 1 (0-4.8): Warsaw, the vault. The lid slides over the gold, the hammer nails it, the stencil is cut.
function crateNailed(g, k, t, S) {
  // pan, 4.8 s, ease-out, left to right across the crate, with a slow 6% push
  const cam = { x: lerp(-110, 90, EASE.out(k)), y: lerp(10, -10, k), z: lerp(1.04, 1.1, EASE.inOut(k)) };
  const nails = [CUES.nail1, CUES.nail2, CUES.nail3], hitAge = Math.min(...nails.map((c) => (t >= c ? t - c : 9)));
  const jolt = hitAge < 0.25 ? Math.sin(hitAge * 60) * 6 * (1 - hitAge / 0.25) : 0;
  stage(g, S, { ...cam, y: cam.y + jolt * 0.4 });
  // the vault floor, lit by one lamp above the crate
  engrave(g, SH.rect(-1300, -800, 2600, 1600), { tone: TN.pool(-60, -40, 980, 0.32, 1.0), angle: 0, sp: 6.6, w: 3, knock: false });
  for (let j = -6; j <= 6; j++) { g.save(); g.fillStyle = INK; g.globalAlpha = 0.55; g.fillRect(-1300, j * 120 - 2, 2600, 3); g.restore(); }
  // the crate: rim boards and its shadow
  engrave(g, SH.poly([[-600, -320], [660, -320], [700, 360], [-560, 360]]), { tone: 0.9, angle: -20, sp: 5.4, knock: false });
  const X0 = -620, Y0 = -330, CW = 1240, CH = 660, rim = 46;
  engrave(g, SH.rect(X0 + rim, Y0 + rim, CW - 2 * rim, CH - 2 * rim), { tone: 0.78, angle: 90, sp: 5.6, line: 2 });
  for (let row = 0; row < 4; row++) for (let col = 0; col < 6; col++)
    goldBar(g, X0 + rim + 14 + col * 188, Y0 + rim + 18 + row * 140, 172, 118, row * 6 + col + 1);
  plank(g, X0, Y0, CW, rim, 3, 0.36); plank(g, X0, Y0 + CH - rim, CW, rim, 4, 0.5);
  g.save(); g.translate(X0, Y0); g.rotate(Math.PI / 2); plank(g, 0, -rim, CH, rim, 5, 0.34); g.restore();
  g.save(); g.translate(X0 + CW, Y0); g.rotate(Math.PI / 2); plank(g, 0, 0, CH, rim, 6, 0.52); g.restore();
  // the lid: three boards and two battens slide in from the right, fastest at frame 0
  const lx = lerp(1300, 0, EASE.inOut(clamp((t - CUES.lid) / 1.3))) + jolt;
  g.save(); g.translate(lx, 0);
  engrave(g, SH.rect(X0 + 26, Y0 + 30, CW, CH), { tone: 0.94, angle: -30, sp: 5, knock: false });   // its shadow
  for (let b = 0; b < 3; b++) plank(g, X0, Y0 + b * (CH / 3), CW, CH / 3, 20 + b, 0.3 + b * 0.05);
  for (const bx of [X0 + 120, X0 + CW - 190]) plank(g, bx, Y0 - 6, 70, CH + 12, 30 + bx, 0.46);
  // stencil, cut letter by letter once the nails are in
  cutText(g, S, 'BANK POLSKI', X0 + CW / 2, Y0 + CH / 2 + 34, 92, clamp((t - CUES.stencil) / 0.7), { role: 'text', weight: 700, world: true, align: 'center', track: 0.18, color: '#2a1d14' });
  // nail heads appear on their strike
  const nx = [X0 + 155, X0 + CW / 2, X0 + CW - 155];
  nails.forEach((c, i) => {
    if (t < c) return;
    const s = SH.circle(nx[i], Y0 + 50, 13);
    engrave(g, s, { tone: TN.lit(nx[i], Y0 + 50, 13, 0.35, 0.5), angle: 45, sp: 3.4, w: 1.6, line: 1.4 });
    burst(g, nx[i], Y0 + 50, (t - c) / 0.22);
  });
  g.restore();
  // the hammer: raised with anticipation, strikes on the cue, rebounds; it travels from nail to nail
  const ni = nails.findIndex((c) => t < c + 0.45), idx = ni < 0 ? 2 : ni, c = nails[idx];
  const hx = nx[idx], hy = Y0 + 50, dtc = t - c;
  let ang = dtc < -0.55 ? -0.9 : dtc < -0.1 ? lerp(-0.9, -1.25, EASE.inOut((dtc + 0.55) / 0.45)) : dtc < 0 ? lerp(-1.25, 0, EASE.in((dtc + 0.1) / 0.1)) : -0.35 * MOTION.spring(dtc, 0.5, 3) - 0.0;
  if (t < 0.9) ang = -0.9 - 0.25 * (1 - t / 0.9);
  const handle = 470, px = hx + 30 + handle, py = hy - 20;
  g.save(); g.translate(px, py); g.rotate(ang);
  engrave(g, SH.round(-handle, -16, handle + 40, 32, 10), { tone: TN.lit(-handle / 2, 0, 200, 0.42, 0.25), angle: 0, sp: 5, w: 2.2, line: 1.8 });
  engrave(g, SH.round(-handle - 46, -64, 92, 128, 8), { tone: TN.lit(-handle, -20, 60, 0.6, 0.3), angle: 90, sp: 4.6, w: 2.3, line: 2.2 });
  g.restore();
  caption(g, S, 'WARSZAWA · IX.1939', '华沙', clamp((t - 0.6) / 1.4));
  plateFrame(g, S);
}

// ---- Scene 7 (46-56.05): Brest, 22 Sept. A locked frontal frame; tanks of both armies pass the tribune on the coda's chords.
function soldierRow(n, x0, x1, y, h) {         // standing men far off: helmet, shoulders, a rifle every few
  const p = new Path2D(), dx = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * dx + dx / 2;
    p.ellipse(x, y - h * 0.86, h * 0.13, h * 0.1, 0, Math.PI, TAU); p.rect(x - h * 0.16, y - h * 0.84, h * 0.32, h * 0.6);
    p.rect(x - h * 0.12, y - h * 0.26, h * 0.1, h * 0.26); p.rect(x + h * 0.02, y - h * 0.26, h * 0.1, h * 0.26);
    if (i % 3 === 0) p.rect(x + h * 0.15, y - h * 1.15, 3, h * 0.6);
  }
  return { p, b: [x0, y - h * 1.2, x1, y] };
}
function figure(x, y, h, salute) {             // an officer on the tribune, a silhouette at distance
  const p = new Path2D();
  p.arc(x, y - h * 0.86, h * 0.075, 0, TAU);
  p.rect(x - h * 0.12, y - h * 0.97, h * 0.24, h * 0.05);
  p.moveTo(x - h * 0.13, y - h * 0.76); p.lineTo(x + h * 0.13, y - h * 0.76); p.lineTo(x + h * 0.16, y - h * 0.3); p.lineTo(x - h * 0.16, y - h * 0.3); p.closePath();
  p.rect(x - h * 0.1, y - h * 0.3, h * 0.08, h * 0.3); p.rect(x + h * 0.02, y - h * 0.3, h * 0.08, h * 0.3);
  if (salute) { p.moveTo(x + h * 0.1, y - h * 0.74); p.lineTo(x + h * 0.2, y - h * 0.86); p.lineTo(x + h * 0.08, y - h * 0.92); p.lineTo(x + h * 0.04, y - h * 0.86); p.closePath(); }
  return { p, b: [x - h * 0.25, y - h, x + h * 0.25, y] };
}
function flag(x, y, w, h, t, ph) {             // cloth on a pole: three folds travelling down the fly
  const pts = [], wav = (u) => Math.sin(u * 7 - t * 4.2 + ph) * 12 * u;
  for (let i = 0; i <= 24; i++) { const u = i / 24; pts.push([x + u * w, y + wav(u)]); }
  for (let i = 24; i >= 0; i--) { const u = i / 24; pts.push([x + u * w * (1 - 0.04 * u), y + h + wav(u) * 1.1]); }
  return { s: SH.poly(pts), tone: (px) => 0.2 + 0.3 * (0.5 + 0.5 * Math.cos(((px - x) / w) * 7 - t * 4.2 + ph + 1.2)) };
}
function tank(g, kind, x, y, t) {             // side view, facing right; wheels turn with the distance travelled
  const big = kind === 'bt';
  const hull = big ? SH.poly([[-250, -40], [150, -40], [250, 8], [235, 40], [-250, 40]]) : SH.poly([[-235, -46], [170, -46], [232, -6], [232, 40], [-235, 40]]);
  const track = SH.round(-260, 18, 515, 96, 48);
  g.save(); g.translate(x, y);
  for (let d = 0; d < 5; d++) {                // dust thrown up behind the tracks, thinning as it drifts back
    const age = (d + (x / 160) % 1) / 5, dx = -280 - age * 260, dr = 26 + age * 60;
    engrave(g, SH.circle(dx + hash1(d + 3) * 30, 100 - age * 60, dr), { tone: 0.32 * (1 - age), angle: 20, sp: 6, w: 1.8, knock: false, fams: [[0, 0.12, 1, 1]] });
  }
  engrave(g, SH.ellipse(0, 128, 300, 18), { tone: 0.85, angle: 0, sp: 5, knock: false });                       // shadow
  engrave(g, track, { tone: TN.lit(0, 60, 260, 0.72, 0.2), angle: 0, sp: 5.2, w: 2.6, line: 2.2 });
  const wheels = big ? [-190, -64, 62, 188] : [-196, -118, -40, 38, 116, 194], wr = big ? 46 : 32;
  for (const wx of wheels) {
    engrave(g, SH.circle(wx, 66, wr), { tone: TN.lit(wx, 66, wr, 0.42, 0.45), angle: 30, sp: 4.6, w: 2, line: 1.8 });
    const rot = -x / wr;
    g.save(); g.fillStyle = INK; for (let s = 0; s < 6; s++) { const a = rot + s * TAU / 6; g.beginPath(); g.arc(wx + Math.cos(a) * wr * 0.62, 66 + Math.sin(a) * wr * 0.62, 3.2, 0, TAU); g.fill(); } g.restore();
  }
  engrave(g, hull, { tone: TN.lit(0, 0, 260, 0.36, 0.3), angle: 12, sp: 5.4, w: 2.6, line: 2.4 });
  const tur = big ? SH.poly([[-90, -40], [70, -40], [90, -78], [60, -112], [-70, -112], [-100, -78]]) : SH.poly([[-60, -46], [80, -46], [96, -96], [-50, -104]]);
  engrave(g, SH.rect(big ? 80 : 90, big ? -86 : -82, big ? 230 : 110, big ? 12 : 14), { tone: 0.62, angle: 0, sp: 4.2, w: 1.8, line: 1.6 });  // gun
  engrave(g, tur, { tone: TN.lit(0, -76, 100, 0.34, 0.35), angle: -20, sp: 5, w: 2.4, line: 2.2 });
  engrave(g, SH.circle(big ? -10 : 10, big ? -116 : -106, 16), { tone: 0.55, angle: 45, sp: 4, w: 1.6, line: 1.4 });  // hatch
  g.restore();
}
function brestParade(g, k, t, S) {
  // locked frontal frame with a <=2% breathing push; one dolly zoom (49.5-52.5) swells the town behind the tribune
  const cam = { x: 0, y: 0, z: 1 + 0.02 * EASE.inOut(k) };
  const dz = 1 + 0.16 * EASE.inOut(clamp((t - 49.5) / 3));
  stage(g, S, cam);
  camView(g, S, cam, 0.6, dz);
  engrave(g, SH.rect(-1300, -800, 2600, 760), { tone: TN.vgrad(-560, -40, 0.1, 0.34), angle: 0, sp: 7, w: 2, knock: false, fams: [[0, 0.12, 1, 1]] });  // cold sky
  // the town: a row of facades with windows
  const r = rng(77);
  let fx = -1250;
  while (fx < 1250) {
    const fw = 150 + r() * 170, fh = 220 + r() * 160, top = 60 - fh;
    engrave(g, SH.poly([[fx, 60], [fx, top], [fx + fw * 0.5, top - 40 - r() * 30], [fx + fw, top], [fx + fw, 60]]), { tone: TN.lit(fx + fw / 2, top + fh / 2, fw, 0.36 + r() * 0.12, 0.2), angle: 90, sp: 5.8, w: 2.2, line: 1.6 });
    const cols = Math.floor(fw / 52), rows = Math.floor((fh - 50) / 70);
    for (let a = 0; a < cols; a++) for (let b = 0; b < rows; b++) {
      const wx = fx + 22 + a * ((fw - 44) / cols) + 6, wy = top + 30 + b * 70;
      engrave(g, SH.rect(wx, wy, 20, 36), { tone: 0.82, angle: 90, sp: 4, w: 1.8, line: 1 });
    }
    fx += fw + 6;
  }
  camView(g, S, cam);
  // the square
  engrave(g, SH.rect(-1300, 40, 2600, 800), { tone: TN.vgrad(40, 540, 0.24, 0.5), angle: 4, sp: 6.4, w: 2.4, knock: false, fams: [[0, 0.12, 1, 1], [57, 0.47, 0.8, 1.1]] });
  // flags: two poles, one red for both
  for (const [px, ph, dir] of [[-440, 0, -1], [440, 1.7, 1]]) {
    engrave(g, SH.rect(px - 7, -470, 14, 680), { tone: TN.lit(px, 0, 20, 0.4, 0.4), angle: 90, sp: 4, w: 1.6, line: 1.4 });
    g.save(); g.translate(px, 0); g.scale(dir, 1);
    const f = flag(7, -458, 270, 170, t, ph);
    engrave(g, f.s, { tone: f.tone, angle: 70, sp: 5.2, w: 2.2, wash: PALETTE.red, washA: 0.78, line: 1.8 });
    g.restore();
  }
  // soldiers in ranks on both sides
  engrave(g, soldierRow(16, -960, -560, 168, 74), { tone: 0.78, angle: 80, sp: 4.2, w: 1.8, line: 1 });
  engrave(g, soldierRow(16, 560, 960, 168, 74), { tone: 0.78, angle: 80, sp: 4.2, w: 1.8, line: 1 });
  // the tribune: a stepped wooden stand, railing, two officers side by side
  engrave(g, SH.poly([[-300, 210], [300, 210], [270, 40], [-270, 40]]), { tone: TN.lit(0, 120, 300, 0.5, 0.2), angle: 0, sp: 5.4, w: 2.4, line: 2 });
  engrave(g, SH.rect(-270, 18, 540, 24), { tone: 0.3, angle: 0, sp: 5, w: 2, line: 1.6 });
  for (let i = 0; i <= 10; i++) engrave(g, SH.rect(-262 + i * 52, -40, 8, 60), { tone: 0.5, angle: 90, sp: 3.6, w: 1.4, line: 1 });
  engrave(g, SH.rect(-270, -46, 540, 10), { tone: 0.35, angle: 0, sp: 4, w: 1.6, line: 1.2 });
  engrave(g, figure(-60, 18, 120, false), { tone: 0.84, angle: 75, sp: 3.8, w: 1.8, line: 1.2 });
  engrave(g, figure(60, 18, 124, true), { tone: 0.84, angle: 105, sp: 3.8, w: 1.8, line: 1.2 });
  // the column: one tank on each chord, the two armies taking turns
  const v = 760;
  CUES.chords.forEach((c, i) => {
    const x = (t - c) * v;
    if (x > -1500 && x < 1500) tank(g, i % 2 ? 'bt' : 'pz', x, 318, t);
  });
  caption(g, S, 'BRZEŚĆ · 22.IX.1939', '布列斯特 联合阅兵', clamp((t - CUES.brest - 0.4) / 1.6), { x: DW / 2, align: 'center', y: 210 });
  plateFrame(g, S);
}

// ---- Scene 2 (4.80-12.10): the night road. The convoy runs south with dimmed lamps; bombs fall ahead; it swerves.
function wheel(g, x, y, r, rot, tone = 0.55) {
  engrave(g, SH.circle(x, y, r), { tone: TN.lit(x, y, r, tone, 0.4), angle: 30, sp: 4.2, w: 1.9, line: 1.6 });
  engrave(g, SH.circle(x, y, r * 0.45), { tone: 0.3, angle: 0, sp: 3.6, w: 1.4, line: 1 });
  g.save(); g.fillStyle = INK; for (let s = 0; s < 5; s++) { const a = rot + s * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * r * 0.3, y + Math.sin(a) * r * 0.3, 2.4, 0, TAU); g.fill(); } g.restore();
}
function lampBeam(g, x, y, len, spread, k = 1) {   // a dimmed headlamp: a cone of bare paper cut out of the night
  const s = SH.poly([[x, y - 6], [x + len, y - spread * 0.35], [x + len, y + spread], [x, y + 6]]);
  engrave(g, s, { tone: (px) => 0.05 + 0.32 * clamp((px - x) / len), angle: -4, sp: 7, w: 1.6, knock: 'rgba(243,234,210,' + (0.9 * k).toFixed(2) + ')', fams: [[0, 0.12, 1, 1]] });
}
function bus(g, x, y, t, seed, sc = 1) {     // a 1930s city bus pressed into service: rounded roof, a row of windows, two axles
  g.save(); g.translate(x, y); g.scale(sc, sc);
  lampBeam(g, 205, 40, 420, 120);
  const body = SH.poly([[-210, 70], [-210, -70], [-180, -100], [170, -100], [200, -70], [212, -10], [212, 70]]);
  engrave(g, body, { tone: TN.lit(0, -20, 220, 0.6, 0.22), angle: 0, sp: 5, w: 2.6, line: 2.2 });
  for (let i = 0; i < 6; i++) engrave(g, SH.rect(-180 + i * 58, -78, 44, 52), { tone: 0.92, angle: 90, sp: 3.8, w: 1.8, line: 1.2 });
  engrave(g, SH.rect(-210, 2, 422, 10), { tone: 0.35, angle: 0, sp: 3.6, w: 1.4, line: 1 });
  engrave(g, SH.circle(204, 38, 9), { tone: 0.04, knock: '#fff6dc', line: 1.4 });
  const rot = x / 46; wheel(g, -130, 74, 40, rot); wheel(g, 128, 74, 40, rot);
  g.restore();
}
function truck(g, x, y, t, seed, sc = 1) {   // a covered lorry: cab, bonnet, canvas tilt over the crates, three wheels

    fams: [[0, 0.12, 1, 1], [57, 0.47, 0.84, 1.1], [-38, 0.76, 0.68, 1.28]] });                                       // canvas tilt
  for (let i = 1; i < 5; i++) engrave(g, SH.rect(-230 + i * 60, -100, 5, 150), { tone: 0.8, angle: 90, sp: 3, w: 1.3, knock: false });
  engrave(g, SH.poly([[74, 54], [74, -64], [150, -64], [168, -14], [226, -8], [226, 54]]), { tone: TN.lit(150, 0, 120, 0.56, 0.24), angle: 0, sp: 5, w: 2.4, line: 2.2 });

function blast(g, x, y, age) {                // a bomb on the road: flash, rays, then a rising column of smoke
  if (age < 0 || age > 2.6) return;
  const fl = clamp(1 - age / 0.35);
  if (fl > 0) engrave(g, SH.circle(x, y, 60 + 160 * EASE.out(clamp(age / 0.3))), { tone: (px, py) => 0.04 + 0.4 * clamp(Math.hypot(px - x, py - y) / 220), angle: 0, sp: 8, w: 1.4, knock: 'rgba(255,248,226,' + (0.95 * fl).toFixed(2) + ')', fams: [[0, 0.12, 1, 1]] });
  burst(g, x, y, age / 0.5, 40, 260, 15, 4);
  for (let i = 0; i < 6; i++) {
    const a = clamp(age / 2.6), rr = 40 + i * 14 + a * 90, cy = y - 30 - i * 46 * EASE.out(clamp(age / 1.4)) - a * 80;
    engrave(g, SH.circle(x + (hash1(i + 9) - 0.5) * 50 + a * 60, cy, rr * 0.8), { tone: TN.lit(x, cy, rr * 2, 0.8 - 0.2 * a, 0.12), angle: 60 + i * 15, sp: 5.6, w: 2.2, line: 1.4 * (1 - a) });
  }
}
function convoyNight(g, k, t, S) {
  // tracking shot, 7.3 s, constant, along the convoy from the roadside; it drifts forward in frame
  const lt = t - CUES.road, cam = { x: 260 * lt, y: 110, z: 1 };
  stage(g, S, cam);
  camView(g, S, cam, 0.15);
  engrave(g, SH.rect(-1300 + cam.x * 0.15, -800, 2600, 900), { tone: TN.vgrad(-560, 60, 0.92, 0.72, 0.05), angle: 0, sp: 6.4, w: 2.8, knock: false });   // night sky
  camView(g, S, cam, 0.35);
  const r = rng(8), x0 = Math.floor((cam.x * 0.35 - 1400) / 90) * 90;
  const hills = []; for (let x = x0; x < x0 + 2900; x += 30) hills.push([x, -40 - 50 * noise1(x * 0.004 + 2) - 30 * noise1(x * 0.02)]);
  engrave(g, SH.poly([...hills, [x0 + 2900, 200], [x0, 200]]), { tone: 0.8, angle: 15, sp: 5.6, w: 2.6, line: 1.6 });                     // far ridge
  // a plane far up, crossing before the first bomb (no siren: a drone in the score)
  const pa = clamp((t - 5.6) / 2.4);
  if (pa > 0 && pa < 1) { const px = cam.x * 0.35 - 900 + pa * 1800, py = -380 + pa * 40; g.save(); g.translate(px, py);
    engrave(g, SH.poly([[-60, 0], [50, -6], [64, 0], [50, 6]]), { tone: 0.9, angle: 0, sp: 3, line: 1.4 });
    engrave(g, SH.poly([[-6, -2], [20, -2], [6, -44], [-6, -44]]), { tone: 0.9, angle: 0, sp: 3, line: 1.2 });
    engrave(g, SH.poly([[-6, 2], [20, 2], [6, 30], [-6, 30]]), { tone: 0.9, angle: 0, sp: 3, line: 1.2 }); g.restore(); }
  camView(g, S, cam, 0.7);
  for (let i = Math.floor((cam.x * 0.7 - 1300) / 230); i < Math.floor((cam.x * 0.7 + 1300) / 230); i++) {   // poplars along the verge
    const tx = i * 230 + hash1(i) * 60, th = 300 + hash1(i + 50) * 120;
    engrave(g, SH.ellipse(tx, 120 - th / 2, 34 + hash1(i + 5) * 10, th / 2), { tone: TN.lit(tx, 120 - th / 2, 60, 0.72, 0.25), angle: 80, sp: 4.6, w: 2.2, line: 1.4 });
    engrave(g, SH.rect(tx - 5, 110, 10, 40), { tone: 0.8, angle: 90, sp: 3, w: 1.4 });
  }
  camView(g, S, cam);
  engrave(g, SH.rect(cam.x - 1300, 140, 2600, 700), { tone: TN.vgrad(140, 540, 0.7, 0.86), angle: 3, sp: 6, w: 2.6, knock: false });   // the road
  const blasts = [CUES.bomb1, CUES.bomb2, CUES.bomb3];
  blasts.forEach((c, i) => blast(g, 260 * (c - CUES.road) + 760 + i * 40, 210, t - c));
  const sw = Math.sin(clamp((t - CUES.swerve) / 1.2) * Math.PI) * 46;          // the swerve round the second crater
  const v = 320;                               // the convoy runs a little faster than the camera
  const units = [[bus, -1250], [truck, -520], [bus, 210], [truck, 940]];
  units.forEach(([f, off], i) => {
    const x = off + v * lt - 40, lag = i * 0.12, bob = Math.sin((t + i) * 9) * 2.2;
    f(g, x, 300 + bob + sw * clamp((t - CUES.swerve - lag) / 0.4) * (i % 2 ? 1 : 0.8), t, i, 1.32);
  });
  caption(g, S, 'IX.1939 · 80 T', '八十吨黄金 向南', clamp((t - CUES.road - 0.5) / 1.6), { y: 236 });
  plateFrame(g, S);
}

// ---- the map plate, shared by S3 and S6: Poland in 1939, the route cut by the burin, two fronts of hatching
const GEO = { lon0: 23.4, lat0: 51.4, k: 44 };
const geo = (lon, lat) => [(lon - GEO.lon0) * GEO.k, -(lat - GEO.lat0) * GEO.k * 1.55];
const POLAND = [[17.9, 54.8], [18.55, 54.75], [18.8, 54.3], [19.3, 53.6], [20.2, 53.2], [21.5, 53.1], [22.6, 53.6], [22.9, 54.3], [23.5, 54.35], [24.6, 54.1],
  [25.4, 54.6], [26.6, 55.6], [27.6, 55.2], [28.2, 54.6], [27.6, 53.6], [26.9, 52.9], [27.8, 51.7], [27.3, 50.9], [26.6, 50.3], [26.2, 49.8], [26.4, 48.9],
  [25.9, 48.3], [25.2, 48.0], [24.6, 48.1], [23.5, 48.9], [22.6, 49.05], [21.6, 49.4], [20.9, 49.35], [19.8, 49.2], [19.0, 49.5], [18.6, 49.9], [17.9, 50.05],
  [18.4, 50.4], [18.2, 51.1], [17.4, 51.2], [16.9, 51.6], [16.3, 51.95], [16.0, 52.4], [16.2, 52.9], [16.8, 53.2], [17.0, 53.7], [17.4, 54.2], [17.6, 54.6]];
const ROMANIA = [[22.6, 49.05], [23.5, 48.9], [24.6, 48.1], [25.2, 48.0], [25.9, 48.3], [26.6, 48.2], [28.2, 47.9], [29.6, 46.4], [29.0, 45.2], [27.0, 44.6], [22.4, 44.8], [21.2, 46.4], [22.0, 47.8]];
const CITIES = { 'WARSZAWA': [21.0, 52.23], 'LUBLIN': [22.57, 51.25], 'ŁUCK': [25.33, 50.75], 'BRZEŚĆ': [23.65, 52.1], 'ŚNIATYŃ': [25.57, 48.45] };
const ROUTE = [[21.0, 52.23], [21.9, 51.7], [22.57, 51.25], [23.9, 50.95], [25.33, 50.75], [25.6, 50.0], [25.5, 49.2], [25.57, 48.45], [26.0, 47.9]];
function routeAt(u) {                          // a point u (0..1) along the route and the cut so far
  const P = ROUTE.map(([a, b]) => geo(a, b)), L = [0];
  for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const d = u * L[L.length - 1], pts = [P[0]];
  let i = 1; while (i < P.length && L[i] < d) { pts.push(P[i]); i++; }
  if (i < P.length) { const f = (d - L[i - 1]) / (L[i] - L[i - 1]); pts.push([lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]); }
  return pts;
}
function mapPlate(g, S, t, o) {               // o: { west 0..1, east 0..1, route 0..1, romania wash 0..1, dot (show the gold) }
  const R = 470;
  engrave(g, SH.circle(0, 0, R + 26), { tone: 0.1, angle: 0, sp: 3, w: 1, line: 3 });
  const disc = SH.circle(0, 0, R);
  engrave(g, disc, { tone: 0.2, angle: 0, sp: 4.2, w: 1.1, fams: [[0, 0.12, 1, 1]], line: 1.2 });             // ruled-machine ground
  g.save(); g.clip(disc.p);
  const rom = SH.poly(ROMANIA.map(([a, b]) => geo(a, b)));
  engrave(g, rom, { tone: 0.3, angle: 45, sp: 5, w: 1.6, line: 1.6, wash: o.romania > 0 ? PALETTE.dim : null, washA: 0.55 * o.romania });
  const pl = SH.poly(POLAND.map(([a, b]) => geo(a, b)));
  engrave(g, pl, { tone: TN.lit(0, 0, 400, 0.13, 0.08, 0.04), angle: 0, sp: 6, w: 1.4, line: 2.6 });
  // the fronts: hatching that presses in from the west (and later the east), its edge ragged like a cut not yet cleaned
  const wx = lerp(-480, 60, o.west), ex = lerp(520, 60, o.east);
  if (o.west > 0 || o.east > 0) engrave(g, pl, { knock: false, angle: -30, sp: 5.2, w: 2.8,
    tone: (x, y) => { const j = 40 * (noise1(y * 0.02 + 4) - 0.5); return Math.max(o.west > 0 ? 0.92 * clamp((wx + j - x) / 60) : 0, o.east > 0 ? 0.92 * clamp((x - ex - j) / 60) : 0); } });
  // the route: cut by the burin, the gold point riding at its tip (the signature)
  const pts = routeAt(o.route);
  if (pts.length > 1) { g.save(); g.strokeStyle = INK; g.lineWidth = 5; g.setLineDash([16, 9]); g.lineCap = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.restore(); }
  for (const [name, [a, b]] of Object.entries(CITIES)) {
    const [x, y] = geo(a, b); engrave(g, SH.circle(x, y, 9), { tone: 0.8, angle: 0, sp: 2.4, w: 1.4, line: 1.2 });
    const lo = name === 'BRZEŚĆ' ? [16, 30] : name === 'WARSZAWA' ? [-16, -14] : [16, -12];
    cutText(g, S, name, x + lo[0], y + lo[1], 24, 1, { role: 'text', world: true, track: 0.14, weight: 700, align: lo[0] < 0 ? 'right' : 'left' });
  }
  const tip = pts[pts.length - 1];
  if (o.dot) {
    engrave(g, SH.circle(tip[0], tip[1], 15), { tone: 0.2, angle: 30, sp: 3, w: 1.4, wash: PALETTE.accent, washA: 0.9, line: 1.6 });
    if (o.route > 0 && o.route < 1) {          // the burin: a lozenge steel shaft held low behind the point, swarf curling ahead
      g.save(); g.translate(tip[0], tip[1]); g.rotate(-0.6);
      engrave(g, SH.poly([[18, -4], [150, -12], [158, 0], [150, 12], [18, 4]]), { tone: TN.lit(80, 0, 80, 0.4, 0.4), angle: 0, sp: 3.4, w: 1.4, line: 1.6 });
      g.strokeStyle = INK; g.lineWidth = 1.6; g.beginPath(); for (let i = 0; i < 30; i++) { const a = i * 0.5 + t * 6, rr = 4 + i * 0.6; g.lineTo(-10 - i * 1.2 + Math.cos(a) * rr, -10 + Math.sin(a) * rr * 0.6); } g.stroke();
      g.restore();
    }
  }
  cutText(g, S, 'ROMÂNIA', geo(26.3, 46.6)[0], geo(26.3, 46.6)[1], 30, 1, { role: 'text', world: true, track: 0.3, align: 'center', weight: 700 });
  cutText(g, S, 'POLSKA', geo(20.4, 50.6)[0], geo(20.4, 50.6)[1], 34, 1, { role: 'text', world: true, track: 0.4, align: 'center', weight: 700 });
  g.restore();
  return tip;
}
function routeCut(g, k, t, S) {
  // pull-back reveal, 3 s, ease-out, from the gold point at Warsaw to the whole plate, then a held loupe
  const w = geo(21.0, 52.23), pk = EASE.out(clamp((t - CUES.map) / 3));

  stage(g, S, cam);
  mapPlate(g, S, t, { west: 0.55 * EASE.inOut(clamp((t - CUES.west) / 5.5)), east: 0, route: EASE.inOut(clamp((t - CUES.map - 0.6) / 8.2)), romania: 0, dot: true });
  caption(g, S, '1.IX.1939', '西线', clamp((t - CUES.west + 0.2) / 1.4));

function score(ctx, out) {}                 // the music is the recording (OWN_MUSIC)

// ============================== HELPERS (picture) ==============================
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920, SEED = +q.get('seed') || 7;
const FRAMES = Math.round(FPS * DURATION), TAU = Math.PI * 2, SR = 48000;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const g = canvas.getContext('2d', { alpha: false });
const S = { W, H, u: Math.min(W, H) };       // u = the short side; sizes below are fractions of it

function rng(salt) {                         // seeded PRNG (mulberry32); call rng(salt) inside draw for a fresh, fixed stream
  let a = (SEED * 2654435761 + salt * 974711) >>> 0;

function hash1(n) { const s = Math.sin(n * 127.1 + SEED * 311.7) * 43758.5453; return s - Math.floor(s); }

const lerp = (a, b, k) => a + (b - a) * k;
// Easing names used in camera lines: linear, ease-in, ease-out, ease-in-out, inertia (keeps speed at both ends).
const EASE = {
  linear: (k) => k, in: (k) => k * k * k, out: (k) => 1 - (1 - k) ** 3,
  inOut: (k) => k < 0.5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2,
  inertia: (k) => 0.35 * k + 0.65 * k * k * (3 - 2 * k),

// Motion for things in the frame (KIT/references/motion.md): entrances ease out, exits ease in, nothing living moves linearly.
const MOTION = {
  at: (t, start, dur) => clamp((t - start) / dur),                       // 0..1 progress; a follower uses at(t - lag, ...)
  back: (k, s = 1.7) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2,    // ease-out with overshoot: s 1 ≈ 4%, 1.7 ≈ 10%, 2.2 ≈ 15%
  anticipate: (k, amount = 0.15, share = 0.25) => k < share             // wind back by `amount`, then release

  spring: (tau, zeta = 0.7, f = 2) => {                                  // damped spring tau s after release; zeta 1 firm, 0.7 ≈ 5%, 0.5 ≈ 16%, 0.4 ≈ 25%
    if (tau <= 0) return 0;
    const w = 2 * Math.PI * f;
    if (zeta >= 1) return 1 - Math.exp(-w * tau) * (1 + w * tau);
    const wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + zeta * w / wd * Math.sin(wd * tau));
  },
  stagger: (i, n, spread, order = 'seq') => {                            // start delay of item i of n: seq, reverse, center, random (seeded)
    if (n < 2) return 0;

// ---- Camera (2.5D). Coordinates: (0,0) is the centre, 1 = the short side; y grows downward.
// The world is a stack of flat planes; z = depth behind the subject plane (z = 0), negative = in front of it.
// The camera sits `dist` in front of plane 0; a plane's scale is focal / (dist + z), so moving the camera gives
// real parallax and changing `focal` does not (a zoom). Every move takes an eased value e in 0..1.
const CAM = {
  base: () => ({ x: 0, y: 0, dist: 1, focal: 1, pan: 0, tilt: 0, roll: 0, focusZ: 0, aperture: 0 }),
  pan: (c, e, a, b) => { c.pan += lerp(a, b, e); },           // turn: screen shift, no parallax (+ = right)
  tilt: (c, e, a, b) => { c.tilt += lerp(a, b, e); },         // + = up
  dolly: (c, e, a, b) => { c.dist = lerp(a, b, e); },         // dolly in: b < a
  zoom: (c, e, a, b) => { c.focal = lerp(a, b, e); },         // zoom in: b > a (no parallax)
  truck: (c, e, a, b) => { c.x = lerp(a, b, e); },            // tracking / truck: camera moves sideways (+ = right)
  crane: (c, e, a, b) => { c.y = -lerp(a, b, e); },           // crane / pedestal: + = up
  orbit: (c, e, a, b, targetZ = 0) => {                       // arc around a target plane, degrees
    const ang = lerp(a, b, e) * Math.PI / 180, R = c.dist + targetZ;
    c.x = Math.sin(ang) * R; c.pan -= c.x * c.focal / R;      // turn back toward the target: near and far planes slide
  },
  dollyZoom: (c, e, a, b, subjectZ = 0) => {                  // vertigo: dist changes, focal compensates
    const f0 = c.focal; c.dist = lerp(a, b, e); c.focal = f0 * (c.dist + subjectZ) / (a + subjectZ);
  },
  pushTo: (c, e, x, y, a, b) => { c.dist = lerp(a, b, e); c.x = x * e; c.y = y * e; },   // push-in on a detail at (x, y)
  fpv: (c, e, a, b, bank = 0.15) => { c.dist = lerp(a, b, e); c.roll += bank * Math.sin(Math.PI * e); },   // fly through planes
  handheld: (c, t, amount = 1, salt = 3) => {                 // seeded, low-passed (0.3-1.1 Hz); never per-frame jitter
    const n = (f, o) => 2 * noise1(t * f + salt + o) - 1;
    c.pan += amount * (0.004 * n(1.1, 0) + 0.003 * n(0.3, 40));
    c.tilt += amount * (0.004 * n(1.0, 20) + 0.003 * n(0.27, 60));
    c.roll += amount * 0.003 * n(0.8, 80);
  },
  matchFrom: (c, e, dx, dy) => { c.x += dx * (1 - e); c.y += dy * (1 - e); },   // match cut: start where A's shape was, settle
  rackFocus: (c, e, a, b, aperture = 1) => { c.focusZ = lerp(a, b, e); c.aperture = aperture; },
  // One continuous shot: a fresh camera on the path through `keys` ([{ t, x, y, dist, focal, pan, tilt, roll }], a
  // missing value keeps the previous key's) at time t. Hermite curves with tangents from the neighbours, so the camera
  // flows through every key and never stops on one; it eases only out of the first key and into the last.
  path: (keys, t) => {

    for (const k of keys) { prev = { ...prev, ...k }; K.push(prev); }

    const c = CAM.base(), n = K.length;
    const at = (k) => { for (const f of F) c[f] = k[f]; return c; };
    if (n === 1 || t <= K[0].t) return at(K[0]);
    if (t >= K[n - 1].t) return at(K[n - 1]);

    while (t > K[i + 1].t) i++;
    const dt = K[i + 1].t - K[i].t, u = (t - K[i].t) / dt, u2 = u * u, u3 = u2 * u;
    const m = (j, f) => (j <= 0 || j >= n - 1) ? 0 : (K[j + 1][f] - K[j - 1][f]) / (K[j + 1].t - K[j - 1].t);
    for (const f of F) {
      c[f] = (2 * u3 - 3 * u2 + 1) * K[i][f] + (u3 - 2 * u2 + u) * dt * m(i, f)
        + (-2 * u3 + 3 * u2) * K[i + 1][f] + (u3 - u2) * dt * m(i + 1, f);

  },

  follow: (c, pos, t, lag = 0.35, k = 1, offset = [0, 0]) => {

// Perspective: a camera standing in a 3D world (y up) at (x, y, z), looking at (tx, ty, tz), with a vertical field of
// view in degrees. For anything seen along or around: a road or track receding, a vehicle at three quarters, an orbit
// around a product, a flight through a place. Hand-drawn things stay hand-drawn: view.sprite() places a 2D drawing at a
// 3D point at its true size and depth, view.poly() and view.line() draw ground shapes and objects in perspective, and
// view.haze() fades what is far into the air (aerial perspective: the far is paler and softer, the near darkest).
// Keys for a moving view go through CAM.path like any camera: { t, x, y, z, tx, ty, tz, fov }.
const VIEW = {

    const e = [c.x, c.y, c.z ?? 0], f0 = [(c.tx ?? 0) - e[0], (c.ty ?? 0) - e[1], (c.tz ?? 0) - e[2]];

  return src;
}

function loadAudio(ctx, url) {              // a local WAV next to film.html (XHR works on file:// in the capture)
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open('GET', url.replace(/#/g, '%23')); x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 0 || x.status === 200) ? ctx.decodeAudioData(x.response).then(ok, fail)
      : fail(new Error(`own music: ${url} (${x.status})`));
    x.onerror = () => fail(new Error(`own music: could not load ${url}`)); x.send();
  });
}
window.renderAudio = async () => {
  const ctx = new OfflineAudioContext(2, Math.round(DURATION * SR), SR);
  const bus = ctx.createGain(); duck(bus.gain, 0.8, VO);
  const lim = ctx.createDynamicsCompressor();  // safety only; loudness is set afterwards by master_audio.py
  lim.threshold.value = -6; lim.knee.value = 6; lim.ratio.value = 8; lim.attack.value = 0.003; lim.release.value = 0.15;
  bus.connect(lim).connect(ctx.destination);
  ROOM_IN = makeRoom(ctx, bus);
  await loadSamples(ctx);
  SCENES.forEach((s, i) => { if (s.amb) ambience(ctx, wet(ctx, bus, 0.15), s.from, s.to, s.amb.kind, s.amb.gain, 300 + i); });
  for (const e of SFX) sfx(ctx, bus, e);
  if (OWN_MUSIC) {
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    src.buffer = await loadAudio(ctx, OWN_MUSIC.file); gain.gain.value = OWN_MUSIC.gain ?? 0.8;
    src.connect(gain).connect(bus); src.start(0);
  } else score(ctx, bus);
  return ctx.startRendering();
};

window.READY = loadType(TYPE).then(loadFormulas).then(() => document.fonts.ready).then(() => {
  const qc = typeCheck(g, TYPE, W, H, PALETTE);  // missing glyphs or unreadable contrast stop here; warnings go to the log
  if (qc.errors.length) throw new Error('type check: ' + qc.errors.join(' · '));
  if (!OWN_MUSIC) checkArrangement();          // the user's own song brings its own arrangement
  return { frames: FRAMES, fps: FPS, width: W, height: H, renderer: 'canvas2d', qc: qc.warnings,
           title: TITLE, bounds: SCENES.map((s) => s.from).concat(DURATION), vo: VO.length,
           sfx: SFX.map((e) => [Math.round(e.at * 100) / 100, e.voice, e.dur ?? null]),
           palette: PALETTE, lookPalette: LOOK.palette, families: Object.values(TYPE.roles || {}).filter(Boolean).map((r) => r.family) };
});

// Text check (make.py runs it on drafts and finals, ?textcheck=1 only; renders never take this path). Every fillText and
// strokeText on a full-frame canvas is watched: its ink is the pixels it changed. Ink of two lines stacked over each
// other on the same pixels is an overlap; a piece of type whose face is within 2:1 of what is around half or more of
// its letters is low contrast. window.textCheck(frame) draws one frame and returns what it found there.
if (q.get('textcheck')) {
  const P = CanvasRenderingContext2D.prototype, owners = new WeakMap(), calls = [];
  let frameStart = 0, found = [];
  const lin = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const lum = (r, gg, b) => 0.2126 * lin(r) + 0.7152 * lin(gg) + 0.0722 * lin(b);
  const rgbOf = (s) => {
    if (typeof s !== 'string') return null;
    if (s[0] === '#' && s.length === 7) return [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
    const m = s.match(/rgba?\(([^)]+)\)/);
    return m ? m[1].split(',').slice(0, 3).map(Number) : null;
  };
  const watch = (orig, stroke) => function (str, x, y, ...rest) {
    const cv = this.canvas, s = String(str);
    if (cv.width !== W || cv.height !== H || !s.trim() || this.globalAlpha < 0.6) return orig.call(this, str, x, y, ...rest);
    const m = this.measureText(s), T = this.getTransform();
    const pts = [[x - m.actualBoundingBoxLeft, y - m.actualBoundingBoxAscent], [x + m.actualBoundingBoxRight, y - m.actualBoundingBoxAscent],
      [x - m.actualBoundingBoxLeft, y + m.actualBoundingBoxDescent], [x + m.actualBoundingBoxRight, y + m.actualBoundingBoxDescent]]
      .map(([px, py]) => [T.a * px + T.c * py + T.e, T.b * px + T.d * py + T.f]);
    const pad = 3 + (this.shadowBlur || 0) + Math.abs(this.shadowOffsetX || 0) + Math.abs(this.shadowOffsetY || 0);
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[0])) - pad)), x1 = Math.min(W, Math.ceil(Math.max(...pts.map((p) => p[0])) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map((p) => p[1])) - pad)), y1 = Math.min(H, Math.ceil(Math.max(...pts.map((p) => p[1])) + pad));
    if (x1 - x0 < 2 || y1 - y0 < 2) return orig.call(this, str, x, y, ...rest);
    const before = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const result = orig.call(this, str, x, y, ...rest);
    const after = this.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const cap = Math.abs(T.d) * m.actualBoundingBoxAscent, base = T.b * x + T.d * y + T.f;
    const left = Math.min(...pts.map((p) => p[0])), right = Math.max(...pts.map((p) => p[0]));
    const last = calls.length > frameStart ? calls[calls.length - 1] : null, same = last && last.cv === cv;
    // the same string again at about the same place is a layer of one piece of type (extrusion, shadow, outline + fill)
    const layer = same && last.s === s && Math.abs(last.base - base) < 0.3 * cap && Math.abs(last.left - left) < 0.3 * cap;
    // apart: how far a baseline lies outside a piece of type's baselines (all its layers, an extrusion runs deep)
    const apart = (st, b) => Math.max(0, st.lo - b, b - st.hi);
    let run = same && apart(last.stack, base) <= 0.6 * Math.min(last.cap, cap) ? last.run : null;   // bouncing letters stay one line
    if (run && !layer) { run.label += (left - run.right > 0.25 * cap ? ' ' : '') + s; run.right = Math.max(run.right, right); }
    else if (!run) run = { label: s, right };
    let stack = layer ? last.stack : null;
    if (!stack) { if (last) settle(last.stack); stack = { run, ink: null, alpha: 0, cap: 0, overlapped: false, lo: base, hi: base }; }
    if (!stroke) { stack.ink = rgbOf(this.fillStyle); stack.alpha = this.globalAlpha; }   // a gradient face: colour unknown, not judged
    Object.assign(stack, { after, bw: x1 - x0, bh: y1 - y0, cap: Math.max(stack.cap, cap), lo: Math.min(stack.lo, base), hi: Math.max(stack.hi, base) });
    const id = calls.push({ s, base, cap, cv, run, left, right, stack }) - 1;
    let own = owners.get(cv);
    if (!own) { own = new Int32Array(W * H).fill(-1); owners.set(cv, own); }
    const hits = new Map(), bw = x1 - x0;
    for (let i = 0, n = before.length / 4; i < n; i++) {
      const k = i * 4;
      if (Math.abs(after[k] - before[k]) + Math.abs(after[k + 1] - before[k + 1]) + Math.abs(after[k + 2] - before[k + 2]) <= 30) continue;
      const idx = (y0 + Math.floor(i / bw)) * W + x0 + (i % bw), prev = own[idx];
      if (prev >= frameStart && calls[prev].run !== run && calls[prev].s !== s) hits.set(prev, (hits.get(prev) || 0) + 1);
      own[idx] = id;
    }
    for (const [prev, px] of hits) {          // only lines stacked over each other: letters side by side may touch by design
      const o = calls[prev], wide = Math.min(o.right - o.left, right - left);
      const gap = Math.max(0, o.stack.lo - stack.hi, stack.lo - o.stack.hi);
      const stacked = gap > 0.6 * Math.min(o.cap, cap) && Math.min(o.right, right) - Math.max(o.left, left) > 0.3 * wide;
      if (stacked && px >= 6) { found.push({ kind: 'overlap', a: o.run, b: run, px }); stack.overlapped = true; }
    }
    return result;
  };
  // The finished piece of type: its face (the last fill colour) against what is right around each letter after every
  // layer is drawn, so an outline or a shadow that separates the letters counts. A face that fills its whole box has
  // nothing around it: the type is lost in a ground of its own colour.
  function settle(st) {
    if (!st || st.done) return;
    st.done = true;
    if (!st.ink || st.overlapped || st.alpha < 0.85 || st.cap < 6) return;
    const [ir, ig, ib] = st.ink, li = lum(ir, ig, ib), { after, bw, bh } = st, R = Math.max(3, Math.round(st.cap * 0.12));
    const face = (xx, yy) => { const k = (yy * bw + xx) * 4; return Math.abs(after[k] - ir) + Math.abs(after[k + 1] - ig) + Math.abs(after[k + 2] - ib) < 48; };
    let faces = 0, low = 0, all = 0;
    for (let yy = 0; yy < bh; yy++) for (let xx = 0; xx < bw; xx++) {
      if (!face(xx, yy)) continue;
      faces++;
      if ((xx + yy) % 2) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let best = 0, edge = false;
        for (let d = 1; d <= R; d++) {
          const nx = xx + dx * d, ny = yy + dy * d;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) break;
          if (!edge && face(nx, ny)) continue;
          edge = true;
          const k = (ny * bw + nx) * 4, lb = lum(after[k], after[k + 1], after[k + 2]);
          best = Math.max(best, (Math.max(li, lb) + 0.05) / (Math.min(li, lb) + 0.05));
        }
        if (edge) { all++; if (best < 2) low++; }
      }
    }
    const share = faces > 0.7 * bw * bh ? 100 : all >= 20 ? Math.round((100 * low) / all) : 0;
    if (share >= 50) found.push({ kind: 'contrast', run: st.run, share });
  }
  P.fillText = watch(P.fillText, false);
  P.strokeText = watch(P.strokeText, true);
  window.textCheck = (frame) => {
    frameStart = calls.length; found = []; window.renderFrame(frame);
    if (calls.length > frameStart) settle(calls[calls.length - 1].stack);
    const out = new Map();                       // one finding per line pair (overlap) or line (contrast), the worst kept
    for (const f of found) {
      const r = f.kind === 'overlap' ? { kind: 'overlap', a: f.a.label, b: f.b.label, px: f.px } : { kind: 'contrast', s: f.run.label, share: f.share };
      if (r.kind === 'overlap' && r.a === r.b) continue;
      const key = r.kind === 'overlap' ? [r.a, r.b].sort().join('\u0000') : 'c\u0000' + r.s, old = out.get(key);
      if (!old || (r.px ?? r.share) > (old.px ?? old.share)) out.set(key, r);
    }
    return [...out.values()];
  };
}

// Preview in a normal browser: click renders the soundtrack offline and plays picture and sound together.
// The audio clock picks the frame; nothing is fed back into the render.
if (!q.get('capture')) {
  let frame = 0, playing = false, audio = null, src = null, t0 = 0, offset = 0;
  const hud = document.getElementById('hud');
  const stop = () => { if (src) { src.stop(); src = null; } playing = false; };
  const play = async () => {
    audio ??= new AudioContext();
    const buf = await window.renderAudio();
    src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination);
    offset = frame / FPS; t0 = audio.currentTime; src.start(0, offset); playing = true;
    src.onended = () => { if (playing) { playing = false; frame = 0; } };
  };
  addEventListener('click', () => (playing ? stop() : play()));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') playing ? stop() : play();
    if (e.code === 'ArrowRight') { stop(); frame = Math.min(FRAMES - 1, frame + 1); }
    if (e.code === 'ArrowLeft') { stop(); frame = Math.max(0, frame - 1); }
  });
  const loop = () => {
    if (playing) frame = Math.min(FRAMES - 1, Math.floor((audio.currentTime - t0 + offset) * FPS));
    window.renderFrame(frame);
    hud.textContent = `${TITLE} · frame ${frame}/${FRAMES - 1} · t=${(frame / FPS).toFixed(2)}s · ${playing ? 'playing' : 'click to play with sound'}`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
